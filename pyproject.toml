[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "comfyui-translategemma"
description = "ComfyUI node for TranslateGemma — Google's open source translation models with 55 languages & multimodal image translation."
version = "1.3.0"
requires-python = ">=3.12,<3.14"
license = "MIT"
license-files = ["LICENSE"]
# classifiers = [
#     # For OS-independent nodes (works on all operating systems)
#     "Operating System :: OS Independent",
#
#     # OR for OS-specific nodes, specify the supported systems:
#     "Operating System :: Microsoft :: Windows",  # Windows specific
#     "Operating System :: POSIX :: Linux",  # Linux specific
#     "Operating System :: MacOS",  # macOS specific
#
#     # GPU Accelerator support. Pick the ones that are supported by your extension.
#     "Environment :: GPU :: NVIDIA CUDA",    # NVIDIA CUDA support
#     "Environment :: GPU :: AMD ROCm",       # AMD ROCm support
#     "Environment :: GPU :: Intel Arc",      # Intel Arc support
#     "Environment :: NPU :: Huawei Ascend",  # Huawei Ascend support
#     "Environment :: GPU :: Apple Metal",    # Apple Metal support
# ]

dependencies = [
    "transformers>=4.57.0",
    "accelerate",
    "pillow",
    "langid>=1.1.6",
    "opencc-python-reimplemented",
]

[project.optional-dependencies]
quantization = [
    "bitsandbytes>=0.49.2",
]

[project.urls]
Repository = "https://github.com/rookiestar28/ComfyUI-TranslateGemma"
#  Used by Comfy Registry https://registry.comfy.org
Documentation = "https://github.com/rookiestar28/ComfyUI-TranslateGemma/wiki"
"Bug Tracker" = "https://github.com/rookiestar28/ComfyUI-TranslateGemma/issues"

[tool.comfy]
PublisherId = "rookiestar"
DisplayName = "ComfyUI TranslateGemma"
Icon = ""
includes = [
    "__init__.py",
    "nodes/**",
    "utils/**",
    "web/**",
    "requirements.txt",
    "requirements-quantization.txt",
    "README.md",
    "LICENSE",
]
# "requires-comfyui" = ">=1.0.0"  # ComfyUI version compatibility

[tool.setuptools]
package-dir = { comfyui_translategemma = "." }
packages = [
    "comfyui_translategemma",
    "comfyui_translategemma.nodes",
    "comfyui_translategemma.utils",
]
include-package-data = false

[tool.setuptools.package-data]
comfyui_translategemma = [
    "pyproject.toml",
    "requirements.txt",
    "requirements-quantization.txt",
    "README.md",
    "LICENSE",
    "web/docs/*.md",
    "web/extensions/*.js",
    "example_workflows/*.json",
    "example_workflows/*.md",
]

